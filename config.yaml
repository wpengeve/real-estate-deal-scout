# Real Estate Deal Scout — Investment Configuration
# All fields are required unless marked with a default comment.

fetch:
  data_source: csv             # "fixtures" | "csv" | "redfin"
  csv_path: data/redfin.csv    # single CSV — used when csv_paths is not set
  csv_paths:                   # combine multiple CSVs (merged + deduplicated by address)
    - data/redfin_2026-03-27-21-35-29.csv
    - data/redfin_2026-03-27-21-36-23.csv
    - data/redfin_2026-03-27-21-36-55.csv
    - data/redfin_2026-03-27-21-37-17.csv
    - data/redfin_2026-03-27-21-38-09.csv
    - data/redfin_2026-03-27-21-41-35.csv
    - data/redfin_2026-03-27-21-42-00.csv
    - data/redfin_2026-03-27-21-42-13.csv
    - data/redfin_2026-03-27-21-42-30.csv
  redfin_region_id: 16904      # only used when data_source: redfin
  redfin_region_type: 6        # 5=county, 6=city
  redfin_max_homes: 350        # Redfin hard cap per request

enrich:
  hud_rent_multiplier: 1.25      # HUD FMR underestimates market rents in Seattle; 1.25 = +25%
  # County is auto-detected from listing ZIP via USPS crosswalk (HUD + Census APIs).
  # To override (e.g. if crosswalk is unavailable), uncomment:
  # hud_state_fips: "53"          # WA=53 (census.gov/geo/reference/ansi_statetables)
  # hud_county_name: "King County"
  # Requires HUD_API_KEY in .env — free at huduser.gov/portal/dataset/fmr-api.html


criteria:
  max_price: 2250000         # USD — maximum purchase price
  min_beds: 3                # minimum bedrooms
  max_dom: 9999              # maximum days on market (9999 = no limit)
  target_cap_rate: 0.05      # 5% minimum cap rate for shortlist ranking
  walkscore_min: 0           # Walk Score minimum (0 = disabled until API key is active)
  dom_outlier_multiplier: 2.0  # flag if DOM > 2x market average
  max_hoa_fee: 0             # monthly HOA fee limit in USD (0 = no HOA allowed)
  min_cap_rate: 0.04         # 4% minimum cap rate hard filter
  preferred_home_types:      # null = no filter; list to restrict by type
    - "Single Family"
  allowed_cities:            # null = no filter; city name must appear in address
    # ~20-mile radius from Seattle city center. Excludes far-out listings that
    # slip into Redfin CSV exports: Puyallup (~35mi), Auburn (~25mi),
    # Federal Way (~25mi), Cle Elum (~80mi), Tacoma (~35mi).
    # To expand coverage, add cities here. To disable, set to null.
    - "Seattle"
    - "Bellevue"
    - "Kirkland"
    - "Redmond"
    - "Lynnwood"
    - "Shoreline"
    - "Kenmore"
    - "Bothell"
    - "Mountlake Terrace"
    - "Issaquah"
    - "Sammamish"
    - "Renton"
    - "Burien"
    - "Tukwila"
    - "Edmonds"
    - "Mercer Island"

financial_assumptions:
  down_payment_pct: 0.25     # 25% down payment (adjust between 0.20–0.30 as needed)
  loan_rate_annual: 0.0525   # 5.25% annual interest rate
  loan_term_years: 30        # 30-year mortgage
  vacancy_rate: 0.08         # 8% vacancy allowance
  management_fee_pct: 0.10   # 10% of gross rent for property management
  maintenance_pct_of_value: 0.01  # 1% of property value annually
  insurance_annual: 1200.0   # USD annual insurance (adjust by market)
  closing_cost_pct: 0.03     # 3% closing costs on purchase price
  property_tax_rate_pct: 0.012  # 1.2% fallback if not in listing data

output:
  max_shortlist: 15          # maximum properties in ranked shortlist
  market: "Seattle, WA"      # target market (overridable via --market CLI flag)
  ranker: ollama             # "mock" | "ollama" | "claude"
  ollama_model: llama3.1:8b  # model name from `ollama list`
  ollama_base_url: http://localhost:11434
