<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Deal Scout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --agent-bg: #ffffff;
      --agent-border: #e5e7eb;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --green-border: #bbf7d0;
      --red: #dc2626;
      --red-light: #fef2f2;
      --radius: 12px;
      --radius-sm: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }

    /* ── Layout ── */
    .layout { display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto; }

    /* ── Header ── */
    header { padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge { font-size: 11px; background: var(--green-light); color: var(--green); border: 1px solid var(--green-border); border-radius: 99px; padding: 2px 8px; }

    /* ── Messages ── */
    .messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }

    .msg { display: flex; gap: 10px; max-width: 90%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .bubble { padding: 10px 14px; border-radius: var(--radius); line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.agent .bubble { background: var(--agent-bg); border: 1px solid var(--agent-border); box-shadow: var(--shadow); color: var(--text); }
    .msg.user  .bubble { background: var(--user-bg); color: var(--user-text); }

    .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; margin-top: 2px; }
    .msg.agent .avatar { background: #dbeafe; }
    .msg.user  .avatar { background: #1d4ed8; color: #fff; }

    /* typing indicator */
    .typing .bubble { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

    /* ── Criteria card ── */
    #criteria-card { display: none; margin: 0 16px 4px; background: var(--green-light); border: 1px solid var(--green-border); border-radius: var(--radius); padding: 14px 16px; }
    #criteria-card h3 { font-size: 13px; font-weight: 600; color: var(--green); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    #criteria-list { list-style: none; display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    #criteria-list li { font-size: 13px; color: var(--text); display: flex; gap: 6px; }
    #criteria-list li::before { content: "·"; color: var(--green); font-weight: bold; }
    #find-btn { width: 100%; padding: 10px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
    #find-btn:hover { background: #15803d; }
    #find-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ── Input bar ── */
    .input-bar { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
    #msg-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 42px; max-height: 120px; line-height: 1.4; transition: border-color .15s; }
    #msg-input:focus { border-color: #93c5fd; }
    #send-btn { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ── Progress overlay ── */
    #progress-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
    #progress-overlay.active { display: flex; }
    .progress-card { background: #fff; border-radius: 16px; padding: 32px 40px; text-align: center; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .spinner { width: 44px; height: 44px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    #progress-text { font-size: 14px; color: var(--text-muted); }

    /* ── Error card ── */
    .error-banner { margin: 8px 16px; padding: 10px 14px; background: var(--red-light); border: 1px solid #fecaca; border-radius: var(--radius-sm); font-size: 13px; color: var(--red); }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <span style="font-size:20px">🏠</span>
      <h1>Real Estate Deal Scout</h1>
      <span class="badge">AI-powered</span>
    </header>

    <div class="messages" id="messages">
      <!-- Initial agent message -->
      <div class="msg agent">
        <div class="avatar">🤖</div>
        <div class="bubble">What kind of investment property are you looking for? Tell me about your budget, target cities, how many bedrooms you need, and how much you're putting down.</div>
      </div>
    </div>

    <!-- Criteria confirmation card (shown after extraction) -->
    <div id="criteria-card">
      <h3>✓ Criteria confirmed</h3>
      <ul id="criteria-list"></ul>
      <button id="find-btn" onclick="startRun()">Find Deals →</button>
    </div>

    <div class="input-bar">
      <textarea id="msg-input" placeholder="Describe what you're looking for..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Progress overlay (shown during pipeline run) -->
  <div id="progress-overlay">
    <div class="progress-card">
      <div class="spinner"></div>
      <h2>Searching for deals…</h2>
      <p id="progress-text">Starting pipeline...</p>
    </div>
  </div>

  <script>
    // ── Session ──────────────────────────────────────────────────────────────
    function getSessionId() {
      let id = localStorage.getItem('scout_session');
      if (!id) { id = crypto.randomUUID(); localStorage.setItem('scout_session', id); }
      return id;
    }
    const SESSION_ID = getSessionId();

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('msg-input');
    const sendBtn    = document.getElementById('send-btn');
    const criteriaCard = document.getElementById('criteria-card');
    const criteriaList = document.getElementById('criteria-list');
    const findBtn    = document.getElementById('find-btn');
    const overlay    = document.getElementById('progress-overlay');
    const progressText = document.getElementById('progress-text');

    // ── Auto-resize textarea ─────────────────────────────────────────────────
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // ── Append message bubble ────────────────────────────────────────────────
    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'agent' ? '🤖' : '👤';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    function showTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg agent typing';
      msg.id = 'typing-indicator';
      msg.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function hideTyping() {
      document.getElementById('typing-indicator')?.remove();
    }

    // ── Criteria card ────────────────────────────────────────────────────────
    function showCriteria(criteria) {
      criteriaList.innerHTML = '';
      const fmt = (v) => v != null ? v : '—';
      const items = [
        `Market: ${fmt(criteria.market_name)}`,
        `Cities: ${(criteria.allowed_cities || []).join(', ') || '—'}`,
        `Max price: $${(criteria.max_price || 0).toLocaleString()}`,
        `Min beds: ${fmt(criteria.min_beds)}`,
        `Down payment: ${criteria.down_payment_pct != null ? (criteria.down_payment_pct * 100).toFixed(0) + '%' : '—'}`,
        criteria.loan_rate_annual != null ? `Loan rate: ${(criteria.loan_rate_annual * 100).toFixed(2)}%` : null,
        criteria.max_hoa_fee === 0 ? 'No HOA' : criteria.max_hoa_fee != null ? `Max HOA: $${criteria.max_hoa_fee}/mo` : null,
        criteria.preferred_home_types?.length ? `Types: ${criteria.preferred_home_types.join(', ')}` : null,
      ].filter(Boolean);

      items.forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        criteriaList.appendChild(li);
      });

      criteriaCard.style.display = 'block';
    }

    // ── Send message ─────────────────────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', text);
      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: SESSION_ID, message: text }),
        });

        hideTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Server error' }));
          appendMessage('agent', `⚠️ ${err.detail || 'Something went wrong.'}`);
          return;
        }

        const data = await res.json();
        appendMessage('agent', data.text);

        if (data.confirmed && data.criteria) {
          showCriteria(data.criteria);
        }
      } catch (err) {
        hideTyping();
        appendMessage('agent', '⚠️ Could not reach the server. Is it running?');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // ── Start pipeline run ───────────────────────────────────────────────────
    async function startRun() {
      findBtn.disabled = true;
      overlay.classList.add('active');
      progressText.textContent = 'Starting pipeline...';

      let res;
      try {
        res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: SESSION_ID }),
        });
      } catch {
        overlay.classList.remove('active');
        findBtn.disabled = false;
        appendMessage('agent', '⚠️ Could not start the pipeline. Is the server running?');
        return;
      }

      if (!res.ok) {
        overlay.classList.remove('active');
        findBtn.disabled = false;
        const err = await res.json().catch(() => ({}));
        appendMessage('agent', `⚠️ ${err.detail || 'Could not start the pipeline.'}`);
        return;
      }

      const { run_id } = await res.json();
      pollStatus(run_id);
    }

    // ── Poll pipeline status ─────────────────────────────────────────────────
    async function pollStatus(runId) {
      try {
        const res = await fetch(`/api/run/${runId}`);
        const data = await res.json();

        progressText.textContent = data.progress || 'Running...';

        if (data.status === 'done' && data.report_url) {
          window.location.href = data.report_url;
          return;
        }
        if (data.status === 'error') {
          overlay.classList.remove('active');
          findBtn.disabled = false;
          appendMessage('agent', `⚠️ Pipeline failed: ${data.error || 'Unknown error'}`);
          return;
        }
      } catch {
        // network blip — keep polling
      }

      setTimeout(() => pollStatus(runId), 2000);
    }

    // Focus input on load
    inputEl.focus();
  </script>
</body>
</html>
